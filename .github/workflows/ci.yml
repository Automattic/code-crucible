name: CI

on:
  push:
    branches:
      - trunk
  pull_request:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  check:
    name: Go checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run checks
        run: make check

  regression-tournament:
    name: Regression tournament
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run regression tournament
        run: make regression-tournament

      - name: Upload tournament artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-ranking-poc-crucible
          path: examples/go-ranking-poc/.crucible/runs
          if-no-files-found: ignore
          retention-days: 7
